# A2M continuous integration.
#
# The claim this repository makes is that one unmodified conformance suite
# passes against implementations sharing no storage code -- two engines, two
# languages, two topologies. That claim is only worth anything if it is
# re-proven on every push, against every target, rather than asserted in a
# README. So this workflow runs all of them, and a target that is skipped is a
# target that failed.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # The library, its doctests and its offline suite. No network, no database,
  # no test runner -- if this needs anything installed, something has leaked a
  # dependency into a standard-library-only project.
  library:
    name: library on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling. requires-python claims 3.10, and a claim
        # nothing exercises is a claim that quietly stops being true -- the
        # floor was 3.14 until it was measured.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: No third-party imports outside adapters
        run: python tools/check_stdlib_only.py

      - name: Offline suite
        run: python -m tools.test_a2m

      - name: Docstring examples are true
        run: python -m doctest a2m/memory.py a2m/text.py a2m/retrieval.py a2m/jsonrpc.py a2m/protocol.py a2m/prompt.py

      - name: Examples
        run: |
          python -m examples.embedders
          python -m examples.rag_ingest
          python -m examples.procedural
          python -m examples.llm_wiki

      - name: Both demo topologies
        run: |
          python -m tools.demo_stack
          python -m tools.demo_stack --router

  # Every target that needs nothing but Python or Node. The counts are asserted
  # rather than eyeballed: a suite that silently starts skipping a capability
  # would otherwise still exit 0.
  conformance:
    name: conformance ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: reference
            command: python -m a2m
            expect: 121
          - name: minimal-python
            command: python implementations/server_minimal.py
            expect: 37
          - name: minimal-typescript
            command: node --experimental-strip-types implementations/server_minimal.ts
            expect: 47
          # A corpus that refuses writes (spec §2.1). It is here because the
          # read-only profile is the on-ramp for every existing RAG stack, and
          # an on-ramp nothing exercises is an on-ramp that quietly breaks.
          - name: readonly-corpus
            command: python implementations/server_readonly.py
            expect: 32
          - name: sqlite
            command: python -m implementations.store_sqlite ci.db
            expect: 121
          - name: federated
            command: python -m implementations.server_federated ci-memories/
            expect: 96
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        if: contains(matrix.target.command, 'node')
        with:
          node-version: "22"

      - name: ${{ matrix.target.command }}
        run: |
          python -m tools.conformance --stdio ${{ matrix.target.command }} | tee report.txt
          grep -q "${{ matrix.target.expect }}/${{ matrix.target.expect }} checks passed" report.txt \
            || { echo "::error::expected ${{ matrix.target.expect }} checks"; exit 1; }

  # The HTTP binding reaches checks stdio cannot: Origin, the version header,
  # 405 on GET, the well-known profile -- and that push is honestly refused on a
  # transport that cannot carry a notification back.
  http:
    name: conformance over http
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Serve, then check
        run: |
          python -m a2m --http 8778 &
          for _ in $(seq 1 30); do
            python -c "import socket,sys; sys.exit(0 if socket.socket().connect_ex(('127.0.0.1',8778))==0 else 1)" && break
            sleep 1
          done
          python -m tools.conformance --http http://127.0.0.1:8778/ | tee report.txt
          grep -q "121/121 checks passed" report.txt || { echo "::error::expected 121 checks over http"; exit 1; }

  # Both PostgreSQL targets. They exist to catch tier logic that leaked into a
  # storage engine: store.py holds the tier model and contains no SQL, and the
  # only way to keep that true is to run it on an engine the reference never
  # touches.
  postgres:
    name: conformance ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: a2m
          POSTGRES_PASSWORD: a2m
          POSTGRES_DB: a2m
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U a2m"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: postgres
            command: python -m implementations.store_postgres postgresql://a2m:a2m@127.0.0.1:5432/a2m
            expect: 121
          # The router declares no summarizer, so it honestly runs eight checks
          # fewer. Sharing one expected count across both targets would have
          # hidden that -- which is the whole reason the counts are asserted.
          - name: federated-on-postgres
            command: python -m implementations.server_federated postgresql://a2m:a2m@127.0.0.1:5432/a2mfed --backend postgres
            expect: 96
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the optional driver
        run: pip install "psycopg[binary]>=3.1"

      # The federation points four backends at one database, which must exist
      # before any of them starts.
      - name: Create the federated database
        run: PGPASSWORD=a2m psql -h 127.0.0.1 -U a2m -d a2m -c "CREATE DATABASE a2mfed" || true

      - name: ${{ matrix.target.command }}
        run: |
          python -m tools.conformance --stdio ${{ matrix.target.command }} | tee report.txt
          grep -q "${{ matrix.target.expect }}/${{ matrix.target.expect }} checks passed" report.txt \
            || { echo "::error::expected ${{ matrix.target.expect }} checks"; exit 1; }

  # The claim on the first line of the README: agents from different frameworks
  # share one memory. It went untested until tools/test_interop.py existed, and
  # its first run found a real bug -- the CrewAI adapter could only read what it
  # had written itself. A framework changing its interface is the likeliest way
  # this repository breaks, and this is the only job that would notice.
  #
  # Python 3.12 because CrewAI cannot run on 3.14: its chromadb dependency uses
  # pydantic v1. Kept separate from the stdlib jobs so the fast feedback loop
  # never waits on a large dependency install.
  interop:
    name: cross-framework interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install every framework A2M claims to join
        run: pip install langchain-core agno crewai autogen-core

      - name: Every adapter writes, every adapter reads
        run: |
          python -m tools.test_interop | tee report.txt
          grep -q "covered: langchain, agno, crewai, autogen, raw" report.txt \
            || { echo "::error::an adapter was skipped -- the matrix is smaller than it claims"; exit 1; }

      - name: Two frameworks over one store, end to end
        run: python -m examples.cross_framework

      - name: The n8n workflow's requests are valid A2M
        run: |
          python -m a2m --http 8778 &
          for _ in $(seq 1 30); do
            python -c "import socket,sys; sys.exit(0 if socket.socket().connect_ex(('127.0.0.1',8778))==0 else 1)" && break
            sleep 1
          done
          python -m tools.check_n8n

  # The package an implementer actually installs. Building it is not enough --
  # what matters is that it imports and works from a directory that is not the
  # repository, which is where a missing module or a stray relative path shows.
  package:
    name: wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build
        run: pip install build && python -m build

      - name: Install the wheel somewhere else entirely
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          cd /tmp
          /tmp/fresh/bin/a2m --help >/dev/null 2>&1 || true
          /tmp/fresh/bin/python -c "
          from a2m import connect_local, A2M_VERSION
          from a2m.memory import MemoryStack
          memory = connect_local(MemoryStack())
          memory.remember('installed from the wheel', tier='semantic')
          assert memory.recall(query='wheel')[0]['content'] == 'installed from the wheel'
          assert memory.events()['cursor']
          print('wheel OK', A2M_VERSION)
          "
