[project]
name            = "a2m-protocol"
version         = "0.1.0"
description     = "A2M — the Agent-to-Memory Protocol: specification, reference implementation and conformance suite."
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.14"

# The protocol, the reference implementation and the conformance suite need
# nothing but the standard library. That is a property worth keeping: a
# dependency in this package would become a dependency of every implementer
# who reads it as an example.
dependencies    = []

[project.optional-dependencies]
# Vector indexing for the reference store. Without it, implementations/store_sqlite.py falls back
# cosine in Python -- slower sooner, not a lesser mode of the protocol.
vector    = ["sqlite-vec>=0.1.9"]
# PostgreSQL and pgvector, for a store that outlives one machine.
postgres  = ["psycopg[binary]>=3.1"]
# Local embeddings, used by the reference store and by tools/bench_embeddings.py.
embed     = ["ollama"]
# Framework adapters. Each module in implementations/adapters/ imports one of these and nothing
# else imports them, so a checkout without them still runs every test, every
# conformance target and both demos.
langchain = ["langchain-core>=0.3"]
agno      = ["agno>=2.0"]

[project.urls]
Homepage      = "https://a2m-protocol.org"
Specification = "https://github.com/dibenedetto/a2m-protocol/blob/main/spec/a2m-0.1.md"
Source        = "https://github.com/dibenedetto/a2m-protocol"
