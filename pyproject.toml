[project]
name            = "a2m-protocol"
version         = "0.1.0"
description     = "A2M — the Agent-to-Memory Protocol: specification, reference implementation and conformance suite."
readme          = "README.md"
license         = { text = "MIT" }
authors         = [{ name = "Marco Di Benedetto" }]
keywords        = ["agent", "memory", "protocol", "jsonrpc", "mcp", "llm", "rag", "interoperability"]

# Measured, not guessed: the full suite and every conformance target pass on
# 3.10 through 3.14. 3.9 fails on PEP 604 unions evaluated at runtime, which is
# the actual floor. Requiring a newer interpreter than the code needs is an
# adoption tax paid for nothing, and CI runs the floor on every push so it
# cannot quietly rise again.
requires-python = ">=3.10"

# The protocol, the reference implementation and the conformance suite need
# nothing but the standard library. That is a property worth keeping: a
# dependency in this package would become a dependency of every implementer
# who reads it as an example. tools/check_stdlib_only.py enforces it.
dependencies    = []

classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Software Development :: Libraries :: Application Frameworks",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
	"Typing :: Typed",
]

# `a2m` runs the reference server, so a fresh install can be pointed at by an
# MCP client or a conformance run without knowing the module path.
[project.scripts]
a2m = "a2m.__main__:main"

[project.optional-dependencies]
# Vector indexing for the reference store. Without it, implementations/store_sqlite.py falls back
# cosine in Python -- slower sooner, not a lesser mode of the protocol.
vector    = ["sqlite-vec>=0.1.9"]
# PostgreSQL and pgvector, for a store that outlives one machine.
postgres  = ["psycopg[binary]>=3.1"]
# Local embeddings, used by the reference store and by tools/bench_embeddings.py.
embed     = ["ollama"]
# Framework adapters. Each module in implementations/adapters/ imports one of these and nothing
# else imports them, so a checkout without them still runs every test, every
# conformance target and both demos.
langchain = ["langchain-core>=0.3"]
agno      = ["agno>=2.0"]
crewai    = ["crewai>=0.100"]
autogen   = ["autogen-core>=0.4"]

[project.urls]
Homepage      = "https://a2m-protocol.org"
Specification = "https://github.com/dibenedetto/a2m-protocol/blob/main/spec/a2m-0.1.md"
Source        = "https://github.com/dibenedetto/a2m-protocol"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# The wheel ships the library and nothing else. `implementations/` and `tools/`
# are the specification implemented and judged -- they belong to the checkout,
# where their import rules (nothing, or a2m only) are part of the argument.
[tool.hatch.build.targets.wheel]
packages = ["a2m"]

[tool.hatch.build.targets.sdist]
include = ["a2m", "spec", "implementations", "tools", "examples", "README.md", "DECISIONS.md", "LICENSE"]
